name: iPhone build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", "src/**", "shared/**", "native.html", "capacitor.config.ts", "vite.native.config.ts", "scripts/build-native.mjs", "scripts/smoke-ios.sh", "scripts/assert-ios-ready.mjs", "scripts/collect-ios-diagnostics.mjs", "scripts/ios-simulator-target.mjs", "package*.json", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: iphone-build
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      # Build configuration only, not a credential or protection bypass.
      # This does not claim that this protected preview accepts native traffic.
      SAJDA_NATIVE_API_ORIGIN: https://sajda-test-hypbit.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run sync:ios
      - name: Compile actual iOS app without distribution signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build
      - name: Compile Release configuration without distribution signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Release -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app with preserved permissions
        run: ditto -c -k --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app ios/App/build/Sajda-Simulator.zip
      - name: Boot the app in a real iPhone simulator
        timeout-minutes: 25
        run: bash scripts/smoke-ios.sh
      - name: Simulator app artifact (not installable on a physical iPhone)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sajda-ios-simulator
          path: |
            ios/App/build/Sajda-Simulator.zip
            ios/App/build/sajda-iphone-smoke.png
            ios/App/build/sajda-ui-smoke.json
            ios/App/build/sajda-iphone-smoke.log
            ios/App/build/sajda-diagnostics.json
          retention-days: 7
