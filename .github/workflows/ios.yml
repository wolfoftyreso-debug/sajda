name: iPhone build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ios/**", "src/**", "native.html", "capacitor.config.ts", "vite.native.config.ts", "scripts/build-native.mjs", "scripts/smoke-ios.sh", "package*.json", ".github/workflows/ios.yml"]
permissions:
  contents: read
concurrency:
  group: iphone-build
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      # Build configuration only, not a credential or protection bypass.
      # This does not claim that this protected preview accepts native traffic.
      SAJDA_NATIVE_API_ORIGIN: https://sajda-test-hypbit.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:native
      - run: npm run sync:ios
      - name: Compile actual iOS app without distribution signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/App/build CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app with preserved permissions
        run: ditto -c -k --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app ios/App/build/Sajda-Simulator.zip
      - name: Boot the app in a real iPhone simulator
        timeout-minutes: 8
        run: bash scripts/smoke-ios.sh
      - name: Simulator app artifact (not installable on a physical iPhone)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sajda-ios-simulator
          path: |
            ios/App/build/Sajda-Simulator.zip
            ios/App/build/sajda-iphone-smoke.png
          retention-days: 7
