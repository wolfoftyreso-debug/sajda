name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # No production credentials or deployment privileges in this job.
      # Build the supported Vercel surface, with indexing held in CI.
      VERCEL_ENV: preview
      SAJDA_SEO_INDEXING: noindex
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Use the repository's package-manager version
        run: npm install --global npm@11.13.0 --ignore-scripts
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Static checks, tests, Vercel build and credential-free HTTP smoke
        run: npm run check:ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev
